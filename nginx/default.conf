# ═══════════════════════════════════════════
# PlexusMap — Nginx Reverse Proxy
# ═══════════════════════════════════════════

upstream plexusmap_upstream {
    server plexusmap:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name plexusmap.com www.plexusmap.com;

    # ── Certbot challenge (ACME) ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (enable after SSL setup)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # ── Temporary: serve directly on port 80 until SSL is configured ──
    location / {
        proxy_pass http://plexusmap_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Static assets: aggressive caching ──
    location /_next/static/ {
        proxy_pass http://plexusmap_upstream;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Public files (favicon, manifest, sw.js, etc.) ──
    location ~* ^/(favicon\.ico|manifest\.json|sw\.js|robots\.txt|sitemap\.xml) {
        proxy_pass http://plexusmap_upstream;
        proxy_set_header Host $host;

        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Security headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Limits ──
    client_max_body_size 10m;
}

