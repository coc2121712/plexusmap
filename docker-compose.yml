services:
  # ── PlexusMap App ──
  plexusmap:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    container_name: plexusmap-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plexusmap-net

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: plexusmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plexusmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-plexusmap}
    volumes:
      - plexusmap_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plexusmap}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plexusmap-net

  # ── Redis (future cache) ──
  redis:
    image: redis:7-alpine
    container_name: plexusmap-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - plexusmap_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plexusmap-net

volumes:
  plexusmap_data:
  plexusmap_redis:

networks:
  plexusmap-net:
    driver: bridge
